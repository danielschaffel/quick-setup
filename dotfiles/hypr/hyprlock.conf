background {
    monitor =
    path = screenshot   # or path to your wallpaper
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi there, $USER
    font_size = 25
    position = 0, -40
    halign = center
    valign = center
}
